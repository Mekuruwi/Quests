name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Scan repository secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan with Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate:
    name: Typecheck and build
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release version metadata
        run: npm run release:check

      - name: Build renderer and Electron main process
        run: npm run build

  package:
    name: Package ${{ matrix.os }} installer
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: windows-installer
            artifact-path: |
              dist-electron/installer/*.exe
              dist-electron/installer/*.exe.blockmap
              dist-electron/installer/latest.yml
          - os: macos-latest
            artifact-name: macos-installer
            artifact-path: |
              dist-electron/installer/*.dmg
              dist-electron/installer/*.zip
              dist-electron/installer/*.blockmap
              dist-electron/installer/latest-mac.yml
          - os: ubuntu-latest
            artifact-name: linux-installer
            artifact-path: |
              dist-electron/installer/*.AppImage
              dist-electron/installer/*.blockmap
              dist-electron/installer/latest-linux.yml
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build platform installer
        run: npm run electron:build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify release tag and package metadata
        run: npm run release:check -- "$GITHUB_REF_NAME"

      - name: Download platform installers
        uses: actions/download-artifact@v8
        with:
          pattern: '*-installer'
          path: release-assets
          merge-multiple: true

      - name: Verify installer and updater assets
        run: npm run release:check -- "$GITHUB_REF_NAME" --assets release-assets

      - name: Create release and attach installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --generate-notes --title "Questly $GITHUB_REF_NAME"
